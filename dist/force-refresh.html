<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Force refresh</title>
  <style>body{font-family:system-ui,Segoe UI,Roboto,Arial,sans-serif;display:flex;align-items:center;justify-content:center;height:100vh;margin:0;background:#f8fafc;color:#111} .card{max-width:640px;padding:24px;border-radius:8px;background:#fff;box-shadow:0 6px 24px rgba(2,6,23,0.08);text-align:center} button{margin-top:16px;padding:8px 12px;border-radius:6px;border:1px solid #e2e8f0;background:#2563eb;color:#fff}</style>
</head>
<body>
  <div class="card">
    <h1>Refresh in progress</h1>
    <p>This page will clear cached data and reload the site to get the latest version. Wait a few seconds.</p>
    <div id="status">Running...</div>
    <button id="retry" style="display:none">Retry</button>
  </div>
  <script>
    async function run() {
      try {
        // Try to unregister any service workers
        if ('serviceWorker' in navigator) {
          const regs = await navigator.serviceWorker.getRegistrations();
          for (const r of regs) {
            try { await r.unregister(); } catch(e){}
          }
        }
        // Clear caches
        if (window.caches) {
          const keys = await caches.keys();
          await Promise.all(keys.map(k => caches.delete(k)));
        }
        // Clear localStorage/sessionStorage that may hold app state
        try { sessionStorage.clear(); localStorage.clear(); } catch(e){}
        document.getElementById('status').textContent = 'Done — reloading now...';
        // Reload the root (bypass cache)
        setTimeout(() => {
          window.location.replace('/');
        }, 1000);
      } catch (e) {
        document.getElementById('status').textContent = 'Failed — try Retry';
        const btn = document.getElementById('retry');
        btn.style.display = 'inline-block';
        btn.addEventListener('click', run);
      }
    }
    run();
  </script>
</body>
</html>
